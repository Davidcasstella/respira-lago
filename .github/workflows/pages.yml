# Publica frontend/ en GitHub Pages. Se ejecuta a mano (pestaña Actions → "Publicar en GitHub Pages").
# Antes, en Settings → Pages, elige Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: despliegue
        uses: actions/deploy-pages@v4
