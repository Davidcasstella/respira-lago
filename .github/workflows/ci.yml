# Revisa cada push y cada pull request: estilo, pruebas unitarias y prueba en navegador.
name: CI

on:
  push:
    branches: [progra-2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  navegador:
    name: Prueba en Chromium (escritorio y celular)
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:navegador -- --capturas capturas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: capturas/
          retention-days: 7
